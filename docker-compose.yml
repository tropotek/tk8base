name: tk8base

services:
  app:
    build:
      context: .
    volumes:
      - ./:/app
      - ./docker/php.ini:/usr/local/etc/php/conf.d/99-moodle.ini
    env_file:
      - ./.env
    ports:
      - "${HTTP_APP_PORT:-80}:80"
      - "${HTTPS_APP_PORT:-443}:443"
      - "${HTTPS_APP_PORT:-443}:443/udp"
    tty: true
    restart: always
    environment:
      DB_HOST: db
      DB_USER: '${MARIADB_USER}'
      DB_PASS: '${MARIADB_PASSWORD}'
#      RELEASE: "dev"
#      SERVER_NAME: :80  # disable HTTPS
    depends_on:
      - db

  db:
    image: mariadb:latest
    env_file:
      - ./.env
    volumes:
      - db:/var/lib/mysql
    ports:
      - '${DB_MARIADB_PORT:-3306}:3306'
    restart: unless-stopped
    tty: true
    environment:
      MARIADB_ROOT_PASSWORD: '${DB_PASS}'
      MARIADB_DATABASE: '${DB_NAME}'
      MARIADB_USER: '${DB_USER}'
      MARIADB_PASSWORD: '${DB_PASS}'
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 3
      timeout: 5s

  # development only
  mailpit:
    image: axllent/mailpit
    volumes:
      - ./docker/mailpit:/data
    ports:
      - "${HTTP_MAILPIT_PORT:-8025}:8025" # Web UI
      - "${SMTP_MAILPIT_PORT:-1025}:1025" # SMTP server
    restart: unless-stopped
    tty: true
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1


volumes:
  app:
  db:
